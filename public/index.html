<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#323437">
  <meta name="description" content="Multiplayer typing. 30-second races with shared cursors.">
  <title>lennytype</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23323437'/%3E%3Cpath d='M16 20v24m16-31v31m16-18v18' stroke='%23e2b714' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="shell">
    <header>
      <a href="./" class="brand" aria-label="lennytype home">lennytype</a>
      <div class="header-controls">
        <button id="profileButton" class="text-button" title="Change name">you</button>
        <button id="settingsButton" class="icon-button" aria-label="Settings"><span data-icon="settings"></span></button>
      </div>
    </header>
    <main>
      <section id="home" aria-label="Rooms">
        <button id="createRoom" class="home-button">create room</button>
        <button id="browseRooms" class="home-button">join room</button>
      </section>
      <section id="game" aria-label="Typing race" hidden>
        <div class="room-bar">
          <div class="room-details"><button id="copyCode" class="room-code" title="Copy room link"><span id="roomCode"></span><span data-icon="copy"></span></button><span id="playerCount"></span></div>
          <button id="leaveRoom" class="text-button">leave</button>
        </div>
        <div class="test-top"><span id="timeLeft" class="timer" hidden>30</span><span id="liveStats" hidden><span id="liveWpm">0</span> wpm <span class="muted">·</span> <span id="liveAccuracy">100</span>%</span></div>
        <div id="waitingArea"><button id="startButton" class="text-button">start race</button></div>
        <div id="typingArea" tabindex="0" role="group" aria-label="Type the displayed words" hidden>
          <div id="wordViewport"><div id="wordTrack"><div id="words" aria-hidden="true"></div></div></div>
          <div id="carets" aria-hidden="true"></div>
          <textarea id="typingInput" aria-label="Type the words here" autocomplete="off" autocapitalize="off" spellcheck="false" autocorrect="off"></textarea>
          <div id="focusHint">click to focus</div>
        </div>
        <div id="timeTrack" class="time-track" hidden><div id="timeProgress"></div></div>
        <section id="results" aria-label="Race results" hidden>
          <div class="result-numbers"><div><small>wpm</small><strong id="resultWpm">0</strong></div><div><small>accuracy</small><strong id="resultAccuracy">100<span>%</span></strong></div><div><small>place</small><strong id="resultPlace">1<span>/1</span></strong></div></div>
          <div id="leaderboard"></div>
          <button id="againButton" class="text-button">race again</button>
        </section>
        <div id="playerList" aria-label="Players"></div>
      </section>
    </main>
  </div>
  <dialog id="joinDialog">
    <form method="dialog" class="dialog-header"><span>join room</span><button aria-label="Close" class="icon-button">×</button></form>
    <form id="joinForm" class="join-row"><input id="joinCode" aria-label="Room code" maxlength="6" placeholder="room code" autocomplete="off"><button class="text-button" type="submit">join</button></form>
    <div class="room-list-heading"><span>rooms</span><button id="refreshRooms" class="icon-button" aria-label="Refresh rooms"><span data-icon="refresh"></span></button></div>
    <div id="roomList" role="list" aria-label="Available rooms"></div>
    <p id="roomError" class="error-message" role="alert"></p>
  </dialog>
  <dialog id="profileDialog">
    <form method="dialog" class="dialog-header"><span>name</span><button aria-label="Close" class="icon-button">×</button></form>
    <form id="nameForm"><input id="nickname" aria-label="Name" maxlength="16" placeholder="you" autocomplete="nickname"><button class="text-button save-name" type="submit">save</button></form>
  </dialog>
  <dialog id="settingsDialog">
    <form method="dialog" class="dialog-header"><span>settings</span><button aria-label="Close" class="icon-button">×</button></form>
    <div class="setting-row"><label for="smoothSetting">smooth cursors</label><input type="checkbox" role="switch" id="smoothSetting" checked></div>
    <div class="setting-row"><label for="statsSetting">live stats</label><input type="checkbox" role="switch" id="statsSetting" checked></div>
    <div class="setting-row"><label for="themeSelect">theme</label><select id="themeSelect"><option value="serika">serika dark</option><option value="midnight">midnight</option><option value="paper">paper</option></select></div>
    <div class="credits"><a href="./THIRD_PARTY_NOTICES.md" target="_blank" rel="noreferrer">credits</a><a href="./LICENSE" target="_blank" rel="noreferrer">GPL-3.0</a></div>
  </dialog>
  <div id="toast" role="status"></div>
  <script src="./config.js"></script>
  <script src="./app.js" defer></script>
</body>
</html>
